[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunchbot"
version = "1.1.7"
description = "Auto-order your weekday lunch on DoorDash, with a Mac menu-bar app."
readme = "README.md"
requires-python = ">=3.11"
# The menu-bar app needs rumps (which pulls pyobjc). The ordering/CLI path
# imports NONE of these — a GUI dependency problem can never stop lunch.
dependencies = ["rumps>=0.4.0"]

[project.scripts]
lunchbot = "lunchbot.__main__:main"
lunchbot-gui = "lunchbot.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lunchbot.gui" = ["icons/*.svg", "icons/*.txt"]
# Lunchbot.app's Finder/Dock icon, copied into the bundle by appbundle.py.
"lunchbot" = ["resources/*.icns"]
